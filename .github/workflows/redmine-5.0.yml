name: Redmine 5.0

# Thin caller: everything it knows is which branch and which Ruby. The steps live
# in specs.yml, which in turn calls the .codex scripts, so CI and a laptop run the
# same thing.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  specs:
    # A branch in this repository is already covered by its push event, so the
    # pull_request event only matters for forks. Without this the matrix would run
    # twice for every push to a branch that has a pull request open.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/specs.yml
    with:
      redmine: 5.0-stable
      ruby: '3.1'
